[project]
name = "metronome"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4.5",
    "pdfplumber>=0.11.8",
    "snowflake-connector-python>=3.18.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metronome"]

[tool.pytest.ini_options]
pythonpath = ["src"]
